<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tigy</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Pages are cached for everyone, so the visitor's own theme and credits panel state are
         applied here, before first paint, instead of in the server's HTML. -->
    <script>
      try {
        var root = document.documentElement;
        var theme = localStorage.getItem('tigy.theme');
        if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
        if (localStorage.getItem('tigy.credits') === 'closed')
          root.dataset.credits = 'closed';
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
