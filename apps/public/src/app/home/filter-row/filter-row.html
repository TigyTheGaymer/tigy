<div class="bar">
  <nav class="filters container" aria-label="Filters and sort">
    <span class="pickers" role="group" aria-label="Filter by">
      @for (picker of pickers(); track picker.kind) {
        <app-filter-picker
          [name]="picker.name"
          [icon]="picker.icon"
          [active]="picker.active"
          [choices]="choices()[picker.kind]"
          [isSearchable]="picker.kind !== 'years'"
          [hasPeople]="picker.isPeople"
          [isLoading]="isLoading()"
        />
      }
    </span>
    <a
      class="chip sort"
      routerLink="/"
      [queryParams]="otherSortParams()"
      [attr.aria-label]="
        'Sort: ' + sortName() + '. Switch to ' + otherSortName().toLowerCase()
      "
      ><ng-icon name="lucideArrowDownUp" class="icon" />{{ sortName() }}</a
    >
    @if (hasFilters()) {
      <a class="chip clear" routerLink="/" [queryParams]="clearedParams()"
        ><ng-icon name="lucideX" class="icon" />Clear all</a
      >
    }
  </nav>
</div>
