<header class="mb-6 flex min-h-10 flex-wrap items-center gap-x-3 gap-y-2">
  @if (back(); as link) {
    <a
      hlmBtn
      variant="ghost"
      size="icon"
      class="-ml-2 xl:-ml-12"
      [routerLink]="link"
      [queryParams]="backParams()"
      [attr.aria-label]="backLabel()"
    >
      <ng-icon name="lucideArrowLeft" />
    </a>
  }
  <div class="flex min-w-0 flex-1 flex-wrap items-baseline gap-x-3 gap-y-1">
    @if (heading(); as text) {
      <h1 class="min-w-0 truncate text-xl font-semibold">{{ text }}</h1>
    } @else {
      <div hlmSkeleton class="h-7 w-48 rounded-md"></div>
    }
    <ng-content select="[pageSubtitle]" />
  </div>
  <div class="flex items-center gap-2">
    <ng-content />
  </div>
</header>
