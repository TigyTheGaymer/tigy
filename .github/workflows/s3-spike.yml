# S3 spike: deploy Firestore rules from GitHub Actions with keyless auth
# (Workload Identity Federation, no stored key). Replaced by the real
# pipeline in task 4.2.
name: S3 spike - keyless rules deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/s3-spike.yml]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/418667371179/locations/global/workloadIdentityPools/github/providers/tigy-repo
          service_account: github-deploy@tigy-165cc.iam.gserviceaccount.com
      - run: npx firebase deploy --only firestore:rules --project tigy-165cc --non-interactive
