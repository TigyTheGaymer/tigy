# Every push to main checks and deploys whatever changed since the last
# successful run (design A11). Backend deploys before frontends.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read # nx-set-shas looks up the last successful run
  contents: read
  id-token: write # keyless Google Cloud auth

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The Firestore and Storage emulators behind the rules tests need Java 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # base = the commit of the last successful run, so a failed deploy is
      # retried by the next push.
      - uses: nrwl/nx-set-shas@v5

      # Only when the end-to-end tests are affected.
      - name: Install Chromium for the end-to-end tests
        run: |
          if [ -n "$(npx nx show projects --affected --withTarget e2e)" ]; then
            npx playwright install --with-deps chromium
          fi

      - name: Lint, test, build and end-to-end tests
        run: npx nx affected -t lint test build e2e

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/418667371179/locations/global/workloadIdentityPools/github/providers/tigy-repo
          service_account: github-deploy@tigy-165cc.iam.gserviceaccount.com

      # nx affected has no --projects filter (it would be passed on to the
      # tasks), so each stage excludes the other stage's tag. Every project
      # with a deploy target must be tagged backend or frontend.
      - name: 'Stage 1: backend (rules, indexes, functions)'
        run: npx nx affected -t deploy --exclude=tag:frontend --parallel=1
        env:
          # A secret, not a variable: this repository's logs are public, and only secrets are masked.
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}

      - name: 'Stage 2: frontends (admin, public)'
        run: npx nx affected -t deploy --exclude=tag:backend --parallel=1 --commit=${{ github.sha }}
