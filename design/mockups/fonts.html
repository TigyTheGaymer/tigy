<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tigy display fonts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;900&display=swap" />
    <style>
      body {
        margin: 0;
        background: #f5a742;
        color: #4b1416;
        font-family: 'Nunito', system-ui, sans-serif;
      }
      main {
        max-width: 1400px;
        margin: 0 auto;
        padding: 28px 24px 60px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.6rem;
      }
      .lede {
        margin: 0 0 22px;
        font-weight: 600;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr));
        gap: 16px;
      }
      .font {
        padding: 18px 20px;
        border-radius: 8px;
        background: #fde3bc;
      }
      .font.dark {
        background: #2a0d0e;
        color: #fde3bc;
      }
      .name {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 0.85rem;
        font-weight: 600;
      }
      .name b {
        font-weight: 900;
      }
      .big {
        font-size: 5rem;
        line-height: 1;
      }
      .head {
        margin-top: 6px;
        font-size: 2.2rem;
        line-height: 1.1;
      }
      .g {
        float: right;
        font-size: 4rem;
        line-height: 1;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Display font: in use and alternates</h1>
      <p class="lede">Grandstander is the display font for now. Fredoka and Sour Gummy are kept as alternates with a standard “g”, for a possible later swap.</p>
      <div class="grid" id="grid"></div>
    </main>
    <script>
      var FONTS = [
        ['Grandstander', 800, 'In use'],
        ['Fredoka', 700, 'Alternate'],
        ['Sour Gummy', 800, 'Alternate'],
      ];
      document.getElementById('grid').innerHTML = FONTS.map(function (f, i) {
        var style = "font-family:'" + f[0] + "';font-weight:" + f[1];
        return (
          '<section class="font' + (i % 2 ? ' dark' : '') + '">' +
          '<div class="name"><b>' + f[0] + '</b><span>' + f[2] + '</span></div>' +
          '<div class="g" style="' + style + '">g</div>' +
          '<div class="big" style="' + style + '">Tigy</div>' +
          '<div class="head" style="' + style + '">All the art · Hey Pookie!</div>' +
          '</section>'
        );
      }).join('');
    </script>
  </body>
</html>
